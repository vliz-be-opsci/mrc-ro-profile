
name: Package MRC RO Profile

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{github.event.release.tag_name }}

      - name: Extract profile version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # Remove the leading 'v' from the tag, e.g. v0.1.0 -> 0.1.0
          VERSION_WITHOUT_V="${TAG#v}"
          # Extract major.minor, e.g. 0.1.0 -> 0.1
          PROFILE_VERSION=$(echo "$VERSION_WITHOUT_V" | sed 's/\([0-9]*\.[0-9]*\)\..*/\1/')
          echo "profile_version=$PROFILE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_without_v=$VERSION_WITHOUT_V" >> "$GITHUB_OUTPUT"
          echo "Detected profile version: $PROFILE_VERSION from tag $TAG"

      - name: Zip profile directory
        run: |
          PROFILE_DIR="profiles/mrc-ro-profile/${{ steps.version.outputs.profile_version }}"
          if [ ! -d "$PROFILE_DIR" ]; then
            echo "Error: Profile directory $PROFILE_DIR does not exist."
            exit 1
          fi
          cd profiles/mrc-ro-profile
          EXTRACT_NAME="mrc-ro-profile-${{ steps.version.outputs.version_without_v }}"
          cp -r "${{ steps.version.outputs.profile_version }}" "$EXTRACT_NAME"
          zip -r "mrc-ro-profile-${{ steps.version.outputs.profile_version }}.zip" "$EXTRACT_NAME/"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: profiles/mrc-ro-profile/mrc-ro-profile-${{ steps.version.outputs.profile_version }}.zip
